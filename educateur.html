<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace éducateur – Boîte à Paroles</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

<section class="card">

<div class="icon">👨‍🏫</div>

<h1>Espace éducateur</h1>

<p class="intro">
Boîte à Paroles – Consultation des demandes du foyer
</p>

<div id="loginBox">

<label for="pin">PIN éducateur</label>

<input
  id="pin"
  type="password"
  inputmode="numeric"
  placeholder="Entre le PIN"
>

<button id="loginBtn">
🔐 Se connecter
</button>

<p id="loginResult" class="result"></p>

</div>

<div id="dashboard" class="hidden">

<div class="toolbar">

<button id="refreshBtn">
🔄 Actualiser
</button>

<button id="printBtn">
🖨️ Imprimer
</button>

</div>

<div class="stats">

<div class="stat">
<strong id="total">0</strong>
<span>Total</span>
</div>

<div class="stat">
<strong id="pending">0</strong>
<span>À traiter</span>
</div>

<div class="stat">
<strong id="progress">0</strong>
<span>En cours</span>
</div>

<div class="stat">
<strong id="done">0</strong>
<span>Traitées</span>
</div>

</div>

<div class="filters">

<select id="categoryFilter">
<option value="">Toutes les catégories</option>
<option>🚨 Signalement</option>
<option>💬 Réclamation</option>
<option>🙋 Demande</option>
<option>💡 Proposition / idée</option>
<option>❤️ Autre</option>
</select>

<select id="statusFilter">
<option value="">Tous les statuts</option>
<option>À traiter</option>
<option>En cours</option>
<option>Traité</option>
</select>

<input
  id="search"
  type="search"
  placeholder="🔎 Rechercher..."
>

</div>

<div id="messages" class="messages"></div>

</div>

</section>

</main>

<script src="educateur.js"></script>

</body>
</html>
